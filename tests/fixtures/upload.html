<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OW Fixture: Upload</title>
</head>
<body>
  <h1>Upload Fixture</h1>
  <input type="file" id="file-input">
  <div id="file-status">none</div>
  <script>
    document.getElementById('file-input').addEventListener('change', function (e) {
      var f = e.target.files[0];
      document.getElementById('file-status').textContent = f ? f.name : 'none';
    });
  </script>
</body>
</html>
