<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OW Fixture: Plain Close</title>
</head>
<body>
  <!-- No overlay: the page's own panel has a Close button that is not ours to press. -->
  <section id="panel">
    <p>Editor panel</p>
    <button id="close" onclick="document.getElementById('panel').remove()">Close</button>
  </section>
</body>
</html>
