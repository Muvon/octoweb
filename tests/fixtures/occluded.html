<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OW Fixture: Occluded Button</title>
</head>
<body>
  <h1>Occluded Button Fixture</h1>
  <!-- Overlay never goes away: clicking #target must fail mentioning "covered". -->
  <button id="target" onclick="document.getElementById('status').textContent='clicked'">Occluded Button</button>
  <div id="status">unclicked</div>
  <div id="overlay" style="position:fixed;inset:0;background:rgba(255,0,0,0.3);z-index:9999"></div>
</body>
</html>
