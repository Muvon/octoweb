<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OW Fixture: Rich Paste</title>
</head>
<body>
  <h1>Rich Paste Fixture</h1>
  <div id="source" contenteditable="true">Hello <b>bold</b> <a href="https://example.com/">link</a></div>
  <div id="target" contenteditable="true"></div>
  <div id="pastestatus">none</div>
  <script>
    document.getElementById('target').addEventListener('paste', function (e) {
      var types = Array.from((e.clipboardData && e.clipboardData.types) || []);
      document.getElementById('pastestatus').textContent =
        (e.isTrusted ? 'trusted' : 'synthetic') + ':' + (types.indexOf('text/html') >= 0 ? 'html' : 'nohtml');
    });
  </script>
</body>
</html>
