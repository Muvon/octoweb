name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Format
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check dependencies
        run: cargo check --locked --all-targets

  test:
    name: Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run tests
        run: cargo test --locked --all
        env:
          RUST_LOG: trace

  build:
    name: Build (debug)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build debug
        run: cargo build --locked

      - name: Build release
        run: cargo build --locked --release

  build-multiarch:
    name: Build (all platforms)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15-arm64, macos-15-x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build release
        run: cargo build --locked --release
        env:
          CARGO_BUILD_JOBS: 4

  brief:
    name: PR Brief
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate PR Brief (New PR)
      if: github.event.action == 'opened'
      uses: muvon/octomind-action@master
      with:
        role: developer:brief
        model: ollama:glm-5.1
        prompt: "Compare branch '${{ github.head_ref }}' to '${{ github.base_ref }}' and provide a brief summary of all changes"
        comment: 'full'
      env:
        OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

    - name: Generate PR Brief (Push to existing PR)
      if: github.event.action == 'synchronize'
      uses: muvon/octomind-action@master
      with:
        role: developer:brief
        model: ollama:glm-5.1
        prompt: "Analyze changes from commit ${{ github.event.before }} to ${{ github.event.after }} and provide a brief summary of incremental changes"
        comment: 'full'
      env:
        OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
