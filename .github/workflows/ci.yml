name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust:
    name: Rust CI
    uses: muvon/ci-workflow/.github/workflows/rust-ci.yml@master
    with:
      # macOS-only app: jobs that compile the crate must run on macOS
      runner: macos-15
      feature-flags: '--all-features'
      test-os: '["macos-15"]'
      test-includes: '[]'
      test-script: 'RUST_LOG=trace cargo test --locked --all'
      doc: false
      coverage: false

  build:
    name: Build (debug)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build debug
        run: cargo build --locked

      - name: Build release
        run: cargo build --locked --release

  build-multiarch:
    name: Build (all platforms)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15-arm64, macos-15-x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build release
        run: cargo build --locked --release
        env:
          CARGO_BUILD_JOBS: 4

  brief:
    uses: muvon/ci-workflow/.github/workflows/brief.yml@master
    secrets: inherit
