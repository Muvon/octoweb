name: Notify Homebrew Tap

# Fires AFTER the GitHub release is published — by which point the DMG is
# expected to be live at https://cdn.octoweb.xyz/<MAJOR>/Octoweb-<VERSION>.dmg.
# The tap repo's update-octoweb.yml workflow then fetches it, computes SHA256,
# and bumps Casks/octoweb.rb. Non-blocking from the release.yml build flow.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to dispatch (e.g. 0.19.0)'
        required: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to muvon/homebrew-tap
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          repository: muvon/homebrew-tap
          event-type: octoweb-release
          client-payload: '{"version": "${{ github.event.inputs.version || github.event.release.tag_name }}"}'
