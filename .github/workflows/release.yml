name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'  # 0.19.0, 1.0.0 — no "v" prefix

env:
  APP_NAME: Octoweb
  SIGN_IDENTITY: "Developer ID Application: MUVON COMPANY LIMITED (34TUP8A7GK)"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      # The release commit bumps Cargo.toml and Info.plist together. acp.rs
      # reports CARGO_PKG_VERSION as the MCP serverInfo the agent sees, so a tag
      # that disagrees with Cargo.toml would ship an app whose own identity
      # disagrees with its label.
      - name: Check version consistency
        run: |
          CARGO_VER=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$VERSION" != "$CARGO_VER" ]; then
            echo "::error::version mismatch — tag=$VERSION Cargo.toml=$CARGO_VER"
            exit 1
          fi

      # CFBundleVersion is derived from the version by build.sh (Sparkle compares it).
      - name: Update Info.plist version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" assets/Info.plist

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Import Developer ID certificate
      - name: Import signing certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$DEVELOPER_ID_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      # Store notarization credentials (profile name matches build.sh)
      - name: Setup notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: "34TUP8A7GK"
        run: |
          xcrun notarytool store-credentials "Muvon-Notarize" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      # build.sh also needs jq (cargo metadata) and downloads Sparkle itself.
      # bash 5: under the runner's /bin/bash 3.2, set -u fails on an empty array
      # and the EXIT trap turns that failure into exit 0.
      - name: Install create-dmg, jq and bash
        run: brew install create-dmg jq bash

      # Build, embed Sparkle, sign, DMG, notarize, staple — all via build.sh.
      # The Google sign-in client is compiled in when its secrets are set;
      # without them Gmail falls back to app passwords, as in a local build
      # without the Keychain items.
      - name: Build and sign
        env:
          OCTOWEB_GOOGLE_CLIENT_ID: ${{ secrets.OCTOWEB_GOOGLE_CLIENT_ID }}
          OCTOWEB_GOOGLE_CLIENT_SECRET: ${{ secrets.OCTOWEB_GOOGLE_CLIENT_SECRET }}
        run: ./build.sh --sign

      - name: Verify notarization
        run: |
          spctl --assess --type open --context context:primary-signature "dist/$APP_NAME.app" 2>&1 || true
          codesign --verify --deep --strict "dist/$APP_NAME.app"
          xcrun stapler validate "dist/$APP_NAME-$VERSION.dmg"
          # Without the tap, octoweb:assistant never resolves and the AI sidebar has no tools.
          test -f "dist/$APP_NAME.app/Contents/Resources/tap/capabilities/octoweb/octoweb.toml"

      # Create draft release with DMG. Homebrew-tap update is intentionally
      # NOT triggered here — it lives in notify-tap.yml and fires on
      # `release: published`, after ./release.sh --skip-build has signed this
      # DMG for Sparkle and uploaded it to cdn.octoweb.xyz.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Octoweb ${{ env.VERSION }}
          draft: true
          generate_release_notes: true
          files: |
            dist/Octoweb-${{ env.VERSION }}.dmg
            dist/Octoweb-${{ env.VERSION }}.dmg.sha256
