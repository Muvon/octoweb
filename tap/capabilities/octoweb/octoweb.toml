# capabilities/octoweb/octoweb.toml
# Capability: octoweb
# Provider: Octoweb — browser-based personal assistant
# Title: Octoweb
# Description: Browser-based personal assistant via Octoweb HTTP server.
#
# The workspace header is what binds an agent to the workspace that spawned it.
# Octoweb sets OCTOWEB_MCP_TOKEN on every agent it launches; without it octomind
# gates this server off rather than letting the agent drive whichever workspace
# happens to be on screen. Agents that only need generic browser control and
# don't care about workspaces should use the `browser` capability instead.

[roles.mcp]
server_refs = ["octoweb"]
allowed_tools = ["octoweb:*"]

# `render_ui` blocks on a human clicking a button, so the client must outwait
# octoweb's own 30-minute cap on that — otherwise the transport gives up first
# and the agent never learns what the user chose.
[[mcp.servers]]
name = "octoweb"
type = "http"
url = "http://localhost:3434/mcp"
timeout_seconds = 2000
tools = []
headers = { "X-Octoweb-Workspace" = "{{ENV:OCTOWEB_MCP_TOKEN}}" }
