[package]
name = "octoweb"
version = "0.19.0"
edition = "2021"

[[bin]]
name = "octoweb"
path = "src/main.rs"

[dependencies]
# WebView + windowing (Tauri team — must stay in sync)
wry = { version = "0.55", features = ["transparent", "devtools", "fullscreen", "mac-proxy"] }
tao = "0.35"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSCursor", "NSEvent", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSPopover", "NSResponder", "NSSavePanel", "NSText", "NSTextField", "NSView", "NSWindow", "NSWorkspace"] }
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSProcessInfo", "NSSet", "NSString", "NSTimeZone", "NSURL", "NSUUID"] }
objc2-web-kit = { version = "0.3", features = ["WKContentRuleList", "WKContentRuleListStore", "WKSnapshotConfiguration", "WKUserContentController", "WKWebExtension", "WKWebExtensionAction", "WKWebExtensionCommand", "WKWebExtensionContext", "WKWebExtensionController", "WKWebExtensionControllerConfiguration", "WKWebExtensionControllerDelegate", "WKWebExtensionDataRecord", "WKWebExtensionDataType", "WKWebExtensionMatchPattern", "WKWebExtensionPermission", "WKWebExtensionTab", "WKWebExtensionTabConfiguration", "WKWebExtensionWindow", "WKWebExtensionWindowConfiguration", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "block2", "objc2-app-kit", "objc2-core-foundation"] }

# Image processing for screenshots (CGImage, CGContext, PNG encode)
core-graphics = { version = "0.25", features = ["highsierra"] }
foreign-types = "0.5"

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utils
libc = "0.2"
dirs = "6"
base64 = "0.22"
security-framework = "3"  # Keychain for SSH tunnel passwords
tokio = { version = "1.50.0", features = ["full"] }
# Assistant sessions on the shared `octomind server` (loopback WebSocket)
tokio-tungstenite = "0.30"
anyhow = "1.0.102"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Mail: IMAP sync, SMTP send, MIME parsing, local store with full-text search.
# TLS goes through native-tls, i.e. macOS Security.framework and its trust store.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
futures = "0.3"
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls", "hostname"] }
rusqlite = { version = "0.40", features = ["bundled"] }

# MCP Server for AI assistant control (HTTP JSON-RPC)
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.0"
axum = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1  # faster dev builds, still usable perf
